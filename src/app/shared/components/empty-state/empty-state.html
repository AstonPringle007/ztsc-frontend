<div class="empty-state">

  <div class="empty-icon">
    <mat-icon>{{ icon() }}</mat-icon>
  </div>

  <h2>{{ title() }}</h2>

  <p>{{ message() }}</p>

  @if (actionLabel()) {
    <button
      mat-raised-button
      color="primary"
      (click)="onAction()">

      <mat-icon>refresh</mat-icon>

      {{ actionLabel() }}

    </button>
  }

</div>
